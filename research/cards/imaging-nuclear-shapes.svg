<text x="266" y="112" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" ><tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan font-style="italic">β</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="normal">2</tspan></tspan><tspan font-style="normal"> = </tspan><tspan font-style="normal">0.286</tspan></tspan></text>
<text x="266" y="129" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" ><tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan font-style="italic">γ</tspan><tspan font-style="normal"> = </tspan><tspan font-style="normal">8.7</tspan><tspan baseline-shift="super" font-size="70%"><tspan font-style="normal">°</tspan></tspan></tspan></text>
