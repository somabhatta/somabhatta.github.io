<text x="50" y="142" font-size="10.5" font-weight="700" fill="#a8281c" text-anchor="middle" ><tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan baseline-shift="super" font-size="70%"><tspan font-style="normal">238</tspan></tspan></tspan>U nucleus</text>
