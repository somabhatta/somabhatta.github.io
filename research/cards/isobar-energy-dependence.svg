<text x="26" y="106" font-size="9" font-weight="400" fill="#4a5a70" text-anchor="middle" transform="rotate(-90 26 106)"><tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="normal">3</tspan></tspan></tspan> ratio Ru/Zr</text>
<text x="123" y="162" font-size="9" font-weight="400" fill="#4a5a70" text-anchor="middle" ><tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan font-style="italic">N</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="italic">ch</tspan></tspan></tspan> →  central</text>
