<text x="14" y="28" font-size="16" font-weight="800" fill="#003366" text-anchor="start" >Isobars at RHIC and LHC energies</text>
<text x="14" y="45" font-size="10.5" font-weight="400" fill="#4a5a70" text-anchor="start" >AMPT <tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan baseline-shift="super" font-size="70%"><tspan font-style="normal">96</tspan></tspan></tspan>Ru+<tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan baseline-shift="super" font-size="70%"><tspan font-style="normal">96</tspan></tspan></tspan>Ru vs <tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan baseline-shift="super" font-size="70%"><tspan font-style="normal">96</tspan></tspan></tspan>Zr+<tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan baseline-shift="super" font-size="70%"><tspan font-style="normal">96</tspan></tspan></tspan>Zr, 0.2 and 5.02 TeV</text>
<path d="M36 152 V58 M36 152 H210" stroke="#4a5a70" stroke-width="1.3" fill="none"/>
<path d="M36 76 H210" stroke="#9aa8ba" stroke-dasharray="3 3"/><text x="210" y="72" font-size="8.5" font-weight="400" fill="#4a5a70" text-anchor="end" >ratio = 1</text>
<path d="M42.0 80.0 L100.0 84.0 L150.0 96.0 L204.0 116.0" fill="none" stroke="#2f6fb3" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="1"/>
