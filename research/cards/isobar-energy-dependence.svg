<rect x="220" y="82" width="10" height="3" fill="#c0392b"/><text x="234" y="86" font-size="9.5" font-weight="700" fill="#c0392b" text-anchor="start" >LHC 5.02 TeV</text>
<text x="222" y="112" font-size="9" font-weight="400" fill="#4a5a70" text-anchor="start" >Zr: octupole</text>
<text x="222" y="124" font-size="9" font-weight="400" fill="#4a5a70" text-anchor="start" >(<tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan font-style="italic">β</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="normal">3</tspan></tspan></tspan>) raises <tspan font-family="'STIX Two Text','Times New Roman',Times,serif" font-size="112%"><tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="70%"><tspan font-style="normal">3</tspan></tspan></tspan></text>
